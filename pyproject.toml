[project]
name = "matheutic"
version = "0.3.0"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "reportlab>=4.4.7,<5",
]

[project.optional-dependencies]
coach = [
    "python-telegram-bot>=22.8",
    "openai>=3.24.0",
    "groq>=1.7.0",
    "python-dotenv>=1.2.4",
    "pydantic>=2.13.5",
]

[dependency-groups]
dev = ["pytest>=8,<10"]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["main", "bot"]

[tool.setuptools.packages.find]
where = ["."]
exclude = ["tests", "tests.*", "docs", "docs.*", "historical", "historical.*"]
namespaces = false

[tool.setuptools.package-data]
storage = ["migrations/*.sql"]

[project.scripts]
matheutic = "main:main"
matheutic-coach = "bot:main"
matheutic-seed-history = "scripts.seed_learner_histories:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
